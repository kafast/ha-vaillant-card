type: custom:vaillant-app-card
# Optional display names (preserved in either language):
# title: Heat pump
# zone_name: Heating
# Entities are matched locally from the myVAILLANT integration.
# Language: auto (Home Assistant), en, de
# language: auto
# Color schemes: home_assistant (default), vaillant, glass, graphite, ocean
# color_scheme: home_assistant
# Optional custom accent colors; quote hex values:
# accent_color: "#03a9f4"
# heating_color: "#ff9800"
# Widget: dashboard (default), overview, heating, hot_water, quick_actions,
# energy, efficiency, power, on_off_cycles, operation_time, system, system_data
# view: heating
# Control mode: full (default), admin, read_only
# control_mode: admin
# Optional additional section restrictions (cannot relax the global mode):
# control_modes:
#   hot_water: admin
#   quick_actions: admin
#   settings: admin
# UI restrictions only; Home Assistant authorization still applies.
# show_header: false
# Internal myVAILLANT power, cycles and operating hours are discovered automatically.
# Optional external power override (any HA sensor with unit W or kW):
# entities:
#   power: sensor.example_heat_pump_power
# Omit or remove the override to use the internal power sensor again.
# Set power: null under entities to explicitly disable automatic power display.
# Heating-circuit selector: auto (default), true, false.
# Appears only in views that use circuit readings/settings.
# show_circuit_selector: auto
# Optional: pin the correct technical circuit index and hide its selector:
# circuit: 0
# show_circuit_selector: false
